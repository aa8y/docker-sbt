schemaVersion: "2.0.0"

# `--allow-empty` is required from SBT 1.5+ when running tasks outside a
# project. `--server` forces SBT 2.x to run in JVM mode instead of trying
# to download the sbtn native client, which has no aarch64-pc-linux build
# on the matching sbtn-dist release; it's a no-op on SBT 1.x.

commandTests:
  - name: "sbt sbtVersion prints the SBT version"
    command: "sbt"
    args: ["--server", "--allow-empty", "sbtVersion"]
    expectedOutput: ["[0-9]+\\.[0-9]+\\.[0-9]+"]
