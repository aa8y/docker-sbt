parameters:
  repository: aa8y/sbt
templates:
  build: docker build -t {{{repository}}}:{{tag}} --build-arg JDK_VERSION={{jdk}} --build-arg SBT_VERSION={{version}} {{{context}}}
  push: docker push {{{repository}}}:{{tag}}
structureTest:
  configs:
    - test/config/common.yaml
    - test/config/version.yaml
contexts:
  .:
    parameters:
      jdk: '8'
    tagKeys:
      - version
    tags:
      '0.12.2':
        structureTest:
          configs:
            - test/config/common.yaml
            - test/config/version-old.yaml
      '0.12.4':
        structureTest:
          configs:
            - test/config/common.yaml
            - test/config/version-old.yaml
      '0.12':
        version: 0.12.4
        structureTest:
          configs:
            - test/config/common.yaml
            - test/config/version-old.yaml
      '0.13.17':
      '0.13.18':
      '0.13':
        version: 0.13.18
      '1.0.3':
      '1.0.4':
      '1.0':
        version: 1.0.4
      '1.1.5':
      '1.1.6':
      '1.1':
        version: 1.1.6
      '1.2.7':
      '1.2.8':
      '1.2':
        version: 1.2.8
      '1':
        version: 1.2.8
      'latest':
        version: 1.2.8
