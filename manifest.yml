parameters:
  repository: aa8y/sbt
templates:
  build: docker build -t {{{repository}}}:{{tag}} --build-arg JDK_VERSION={{jdk}} --build-arg SBT_VERSION={{version}} {{{context}}}
  push: docker push {{{repository}}}:{{tag}}
structureTest:
  configs:
    - test/config/common.yaml
    - test/config/version.yaml
contexts:
  .:
    parameters:
      jdk: '21'
    tagKeys:
      - version
    tags:
      '1.10.11':
      '1.11.7':
      '1.12.11':
      '1.10':
        version: 1.10.11
      '1.11':
        version: 1.11.7
      '1.12':
        version: 1.12.11
      '1':
        version: 1.12.11
      '2':
        version: 2.0.0-RC16
      'latest':
        version: 1.12.11
